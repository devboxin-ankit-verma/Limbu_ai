name: dai_massage
description: Dai Massage — Traditional Indian massage booking platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Routing
  go_router: ^13.2.0

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Image picker (for provider photos)
  image_picker: ^1.0.7

  # Razorpay payment gateway
  razorpay_flutter: ^1.3.6

  # UI helpers
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

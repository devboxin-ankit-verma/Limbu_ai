name: app_flutter
description: Flutter application template following Clean Architecture principles.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Routing
  go_router: ^13.2.0

  # Local storage
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - .env

  # Uncomment and populate as assets are added:
  # - assets/images/
  # - assets/icons/
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf

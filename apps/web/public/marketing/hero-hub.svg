<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
  <defs>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="awningGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F58529"/>
      <stop offset="35%" stop-color="#DD2A7B"/>
      <stop offset="65%" stop-color="#8134AF"/>
      <stop offset="100%" stop-color="#515BD4"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#FBBF24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="storeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1D4ED8" flood-opacity="0.25"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowHead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D1D5DB"/>
    </marker>
  </defs>

  <!-- Background glow -->
  <ellipse cx="320" cy="280" rx="140" ry="130" fill="url(#glowGrad)"/>

  <!-- Connection lines -->
  <g stroke="#E5E7EB" stroke-width="1.5" marker-end="url(#arrowHead)">
    <line x1="320" y1="280" x2="320" y2="52"/>
    <line x1="320" y1="280" x2="500" y2="78"/>
    <line x1="320" y1="280" x2="568" y2="168"/>
    <line x1="320" y1="280" x2="580" y2="278"/>
    <line x1="320" y1="280" x2="548" y2="378"/>
    <line x1="320" y1="280" x2="468" y2="458"/>
    <line x1="320" y1="280" x2="320" y2="498"/>
    <line x1="320" y1="280" x2="172" y2="458"/>
    <line x1="320" y1="280" x2="92" y2="378"/>
    <line x1="320" y1="280" x2="60" y2="278"/>
    <line x1="320" y1="280" x2="72" y2="168"/>
    <line x1="320" y1="280" x2="140" y2="78"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FBBF24" opacity="0.7">
    <path d="M155 95 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" transform="scale(0.7)"/>
    <path d="M490 130 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" transform="scale(0.6)"/>
    <path d="M560 340 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" transform="scale(0.5)"/>
    <path d="M80 420 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" transform="scale(0.55)"/>
    <path d="M420 520 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" transform="scale(0.45)"/>
    <path d="M200 200 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" transform="scale(0.5)"/>
  </g>

  <!-- Feature cards -->
  <g font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#374151">
    <!-- Top -->
    <g filter="url(#cardShadow)">
      <rect x="218" y="28" width="204" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="320" y="50" text-anchor="middle">Automatic GMB Ranking Optimization</text>
    </g>
    <!-- Top right -->
    <g filter="url(#cardShadow)">
      <rect x="430" y="58" width="148" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="504" y="80" text-anchor="middle">Citation Builder Automation</text>
    </g>
    <!-- Right top -->
    <g filter="url(#cardShadow)">
      <rect x="478" y="148" width="168" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="562" y="170" text-anchor="middle">Advanced GMB Insights Dashboard</text>
    </g>
    <!-- Right -->
    <g filter="url(#cardShadow)">
      <rect x="498" y="258" width="118" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="557" y="280" text-anchor="middle">AI Image Creation</text>
    </g>
    <!-- Right bottom -->
    <g filter="url(#cardShadow)">
      <rect x="458" y="358" width="148" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="532" y="380" text-anchor="middle">Magic QR Code Generator</text>
    </g>
    <!-- Bottom right -->
    <g filter="url(#cardShadow)">
      <rect x="398" y="438" width="138" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="467" y="460" text-anchor="middle">Facebook Automation</text>
    </g>
    <!-- Bottom -->
    <g filter="url(#cardShadow)">
      <rect x="238" y="478" width="164" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="320" y="500" text-anchor="middle">Instagram Automation</text>
    </g>
    <!-- Bottom left -->
    <g filter="url(#cardShadow)">
      <rect x="108" y="438" width="128" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="172" y="460" text-anchor="middle">AI Video Generation</text>
    </g>
    <!-- Left bottom -->
    <g filter="url(#cardShadow)">
      <rect x="28" y="358" width="148" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="102" y="380" text-anchor="middle">Advanced GMB Features</text>
    </g>
    <!-- Left -->
    <g filter="url(#cardShadow)">
      <rect x="18" y="258" width="148" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="92" y="280" text-anchor="middle">Citation Builder Automation</text>
    </g>
    <!-- Left top -->
    <g filter="url(#cardShadow)">
      <rect x="28" y="148" width="168" height="36" rx="18" fill="white" stroke="#E5E7EB" stroke-width="1"/>
      <text x="112" y="170" text-anchor="middle">AI Review Auto Reply System</text>
    </g>
  </g>

  <!-- AI badges -->
  <g>
    <circle cx="428" cy="36" r="14" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
    <text x="428" y="40" text-anchor="middle" fill="#111827" font-family="Inter,sans-serif" font-size="8" font-weight="800">AI</text>
    <circle cx="612" cy="268" r="14" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
    <text x="612" y="272" text-anchor="middle" fill="#111827" font-family="Inter,sans-serif" font-size="8" font-weight="800">AI</text>
    <circle cx="108" cy="448" r="14" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
    <text x="108" y="452" text-anchor="middle" fill="#111827" font-family="Inter,sans-serif" font-size="8" font-weight="800">AI</text>
    <circle cx="18" cy="168" r="14" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
    <text x="18" y="172" text-anchor="middle" fill="#111827" font-family="Inter,sans-serif" font-size="8" font-weight="800">AI</text>
  </g>

  <!-- Platform icons -->
  <!-- Instagram -->
  <g transform="translate(395,488)">
    <rect width="28" height="28" rx="7" fill="url(#igGrad)"/>
    <circle cx="14" cy="14" r="7" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="20" cy="8" r="2" fill="white"/>
  </g>
  <!-- Facebook -->
  <g transform="translate(545,448)">
    <circle cx="14" cy="14" r="14" fill="#1877F2"/>
    <text x="14" y="19" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700">f</text>
  </g>
  <!-- Google Maps pin -->
  <g transform="translate(600,148)">
    <path d="M14,0 C6,0 0,7 0,15 C0,26 14,38 14,38 C14,38 28,26 28,15 C28,7 22,0 14,0Z" fill="#EA4335"/>
    <circle cx="14" cy="14" r="5" fill="white"/>
  </g>
  <!-- Chart icon -->
  <g transform="translate(598,158)">
    <rect width="24" height="24" rx="5" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1"/>
    <rect x="5" y="14" width="4" height="6" fill="#F59E0B" rx="1"/>
    <rect x="10" y="10" width="4" height="10" fill="#F59E0B" rx="1"/>
    <rect x="15" y="6" width="4" height="14" fill="#F59E0B" rx="1"/>
    <path d="M5 8 L10 11 L15 7 L19 5" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Central storefront -->
  <g filter="url(#storeShadow)" transform="translate(248,210)">
    <!-- Building body -->
    <rect x="20" y="50" width="104" height="80" rx="8" fill="url(#storeGrad)"/>
    <!-- Awning scallops -->
    <path d="M12 50 Q20 42 28 50 Q36 42 44 50 Q52 42 60 50 Q68 42 76 50 Q84 42 92 50 Q100 42 108 50 Q116 42 124 50 L124 58 L12 58 Z" fill="url(#awningGrad)" stroke="#93C5FD" stroke-width="0.5"/>
    <!-- Awning stripes -->
    <line x1="28" y1="50" x2="28" y2="58" stroke="#93C5FD" stroke-width="0.5" opacity="0.5"/>
    <line x1="44" y1="50" x2="44" y2="58" stroke="#93C5FD" stroke-width="0.5" opacity="0.5"/>
    <line x1="60" y1="50" x2="60" y2="58" stroke="#93C5FD" stroke-width="0.5" opacity="0.5"/>
    <line x1="76" y1="50" x2="76" y2="58" stroke="#93C5FD" stroke-width="0.5" opacity="0.5"/>
    <line x1="92" y1="50" x2="92" y2="58" stroke="#93C5FD" stroke-width="0.5" opacity="0.5"/>
    <line x1="108" y1="50" x2="108" y2="58" stroke="#93C5FD" stroke-width="0.5" opacity="0.5"/>
    <!-- Door/window -->
    <rect x="38" y="72" width="68" height="48" rx="4" fill="#1E40AF" opacity="0.3"/>
    <!-- Google G -->
    <circle cx="72" cy="96" r="22" fill="white"/>
    <text x="72" y="104" text-anchor="middle" fill="#4285F4" font-family="Arial,sans-serif" font-size="24" font-weight="700">G</text>
    <!-- 3D depth side -->
    <path d="M124 50 L132 44 L132 124 L124 130 Z" fill="#1E3A8A" opacity="0.6"/>
    <path d="M12 58 L20 50 L124 50 L132 44 L132 50 L124 58 Z" fill="#2563EB" opacity="0.4"/>
  </g>
</svg>
